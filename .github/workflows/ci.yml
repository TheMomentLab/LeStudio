name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    # Two legs cover both ends of the `lerobot` version range declared in
    # packages/lestudio/pyproject.toml: Python 3.10 resolves the 0.4.x floor,
    # Python 3.12 resolves the latest release, so upstream drift shows up here.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/*/pyproject.toml

      - name: Install backend deps
        # The CPU torch index keeps lerobot's torch dependency small on CI.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e packages/lerobot-doctor -e "packages/lestudio[dev]"
          python -c "import lerobot, torch; print('lerobot', lerobot.__version__, '| torch', torch.__version__)"

      - name: Lint with ruff
        run: python -m ruff check packages

      - name: Type check with mypy
        run: python -m mypy packages/lerobot-doctor/src/lerobot_doctor packages/lestudio/src/lestudio --ignore-missing-imports

      - name: Compile backend
        run: python -m compileall -q packages/lerobot-doctor/src packages/lestudio/src

      - name: Enforce LeRobot import boundary
        run: |
          violations="$(rg -n '\b(from|import)\s+lerobot(\.|\b)' packages/lestudio/src packages/lerobot-doctor/src \
            | grep -vE '(lestudio/(teleop_bridge|record_bridge|camera_patch)|lerobot_doctor/(device_registry|motor_monitor_bridge))\.py:' || true)"
          if [ -n "$violations" ]; then
            echo "Found forbidden lerobot imports:"
            echo "$violations"
            exit 1
          fi

      - name: Run tests
        run: python -m pytest -q -m "not smoke_hw" -p pytest_cov.plugin --cov=lestudio --cov=lerobot_doctor --cov-report=term-missing --cov-report=xml tests

      - name: Smoke-test the lerobot-doctor CLI
        # The runner has no arms or cameras; this checks the entry point,
        # the collectors and the JSON shape on a machine without hardware.
        run: |
          lerobot-doctor --version
          lerobot-doctor ports
          lerobot-doctor cameras
          lerobot-doctor report --json | python -c "import json, sys; d = json.load(sys.stdin); print(sorted(d))"

      - name: Build the lerobot-doctor distribution
        run: |
          python -m pip install build twine
          python -m build packages/lerobot-doctor
          python -m twine check packages/lerobot-doctor/dist/*

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/lestudio/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: packages/lestudio/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: packages/lestudio/frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: packages/lestudio/frontend
        run: npm run typecheck

      - name: Audit design system debt
        working-directory: packages/lestudio/frontend
        run: npm run design:audit

      - name: Test frontend
        working-directory: packages/lestudio/frontend
        run: npm test -- --run

      - name: Install Playwright browser
        working-directory: packages/lestudio/frontend
        run: npx playwright install chromium

      - name: Run frontend E2E smoke tests
        working-directory: packages/lestudio/frontend
        run: npm run test:e2e

      - name: Build frontend (LeStudio profile)
        working-directory: packages/lestudio/frontend
        run: npm run build

      - name: Build frontend (lerobot-doctor profile)
        working-directory: packages/lestudio/frontend
        run: npm run build:doctor
