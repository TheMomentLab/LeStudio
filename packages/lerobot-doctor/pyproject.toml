[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-doctor"
dynamic = ["version"]
description = "Hardware setup and diagnostics for Hugging Face LeRobot arms and cameras: port and camera discovery, udev symlinks, motor checks, calibration validation, pasteable reports"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "TheMomentLab"}]
keywords = ["lerobot", "robotics", "udev", "feetech", "calibration", "diagnostics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# Runs against whatever `lerobot` is installed; the motor bridges import it
# lazily and degrade to a fallback robot catalog when it is absent.
dependencies = []

[project.optional-dependencies]
lerobot = ["lerobot>=0.4.4,<0.7"]

[project.scripts]
lerobot-doctor = "lerobot_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/TheMomentLab/LeStudio/tree/main/packages/lerobot-doctor"
Repository = "https://github.com/TheMomentLab/LeStudio"
Issues = "https://github.com/TheMomentLab/LeStudio/issues"
Changelog = "https://github.com/TheMomentLab/LeStudio/blob/main/CHANGELOG.md"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "lerobot_doctor.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
