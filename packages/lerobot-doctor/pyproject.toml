[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-doctor"
version = "0.1.0"
description = "Hardware setup and diagnostics for Hugging Face LeRobot: stable USB port mapping, motor-ID setup, live motor monitor, calibration validation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "TheMomentLab"}]
keywords = ["lerobot", "robotics", "udev", "feetech", "calibration", "diagnostics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# Runs against whatever `lerobot` is installed; the motor bridges import it
# lazily and degrade to a fallback robot catalog when it is absent.
dependencies = []

[project.urls]
Homepage = "https://github.com/TheMomentLab/lestudio"
Repository = "https://github.com/TheMomentLab/lestudio"
Issues = "https://github.com/TheMomentLab/lestudio/issues"

[tool.setuptools.packages.find]
where = ["src"]
