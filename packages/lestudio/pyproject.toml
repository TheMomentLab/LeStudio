[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lestudio"
version = "0.1.0"
description = "LeStudio: web workbench for Hugging Face LeRobot — hardware setup and diagnostics (via lerobot-doctor) plus teleop, record, dataset, train and eval"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "TheMomentLab"},
]
keywords = ["lerobot", "lestudio", "robotics", "gui", "calibration", "teleop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "lerobot-doctor>=0.1.0",
    # Upstream LeRobot. 0.4.x is the last line that supports Python 3.10/3.11;
    # 0.5+ requires Python 3.12. CI runs both ends of the range.
    # Extras: dataset/training for record + train, hardware for the keyboard
    # listener and serial, motor SDKs for Feetech (SO-100/101) and Dynamixel
    # (OMX). lerobot 0.4.x has no dataset/training/hardware extras (those deps
    # are core there); pip only warns about the unknown extra names.
    "lerobot[dataset,training,hardware,feetech,dynamixel]>=0.4.4,<0.7",
    "fastapi>=0.100.0,<1.0.0",
    "fsspec>=2023.1.0,<=2025.9.0",
    "uvicorn[standard]>=0.20.0,<1.0.0",
    "opencv-python-headless>=4.8.0,<5.0.0",
    "psutil>=5.9.0,<8.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=23.0.1,<26.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "anyio[trio]>=4.0.0,<5.0.0",
    "httpx>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pre-commit>=3.5.0,<5.0.0",
]

[project.scripts]
lestudio = "lestudio.cli:main"

[project.urls]
Homepage = "https://github.com/TheMomentLab/lestudio"
Repository = "https://github.com/TheMomentLab/lestudio"
Issues = "https://github.com/TheMomentLab/lestudio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lestudio = ["static/**"]
