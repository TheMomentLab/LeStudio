# Repository-wide tool configuration. The installable packages live in
# packages/lerobot-doctor and packages/lestudio; each has its own pyproject.

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_ros"
testpaths = ["tests"]
markers = [
    "smoke_hw: hardware smoke tests that require physical devices (/dev/video*, /dev/tty*)",
    "lerobot: tests that require the lerobot package to be installed",
]

[tool.ruff]
line-length = 119
target-version = "py310"
extend-exclude = ["packages/lestudio/src/lestudio/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lestudio", "lerobot_doctor"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "Linux"
venvPath = "/home/jinhyuk2me/miniforge3/envs"
venv = "lerobot"
typeCheckingMode = "off"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
